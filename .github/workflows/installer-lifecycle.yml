name: Installer lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'installer/**'
      - 'src/S3Explorer.Updater/**'
      - 'src/S3Explorer.App/Update*.cs'
      - 'tests/S3Explorer.App.Tests/UpdateRunnerTests.cs'
      - 'tests/S3Explorer.App.Tests/UpdaterMsiIntegrationTests.cs'
      - 'scripts/Build-InstallerLifecycleFixtures.ps1'
      - 'scripts/Test-InstallerLifecycle.ps1'
      - 'scripts/test_update_safety.py'
      - '.github/workflows/installer-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        flavor: [self-contained, framework-dependent]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore S3Explorer.sln --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }
          dotnet restore src/S3Explorer.App/S3Explorer.App.csproj --runtime win-x64 --locked-mode --no-dependencies --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }
          dotnet restore src/S3Explorer.Cli/S3Explorer.Cli.csproj --runtime win-x64 --locked-mode --no-dependencies --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }

      - name: Check offline update safety guards
        shell: pwsh
        run: python ./scripts/test_update_safety.py

      - name: Build local test-only installer versions
        shell: pwsh
        run: ./scripts/Build-InstallerLifecycleFixtures.ps1 -Flavor '${{ matrix.flavor }}'

      - name: Verify production MSI parser including drive roots
        shell: pwsh
        run: |
          $fixtures = Get-Content -Raw './artifacts/installer-lifecycle-fixtures/${{ matrix.flavor }}/fixtures.json' | ConvertFrom-Json
          $env:S3EXPLORER_MSI_ARGUMENT_PROBE = $fixtures.argumentProbeMsi
          $env:S3EXPLORER_MSI_ARGUMENT_LOGS = Join-Path $PWD 'artifacts/installer-lifecycle/argument-probe'
          dotnet test tests/S3Explorer.App.Tests/S3Explorer.App.Tests.csproj -c Release --no-restore --filter 'Category=UpdaterMsiIntegration' --logger 'trx;LogFileName=updater-msi.trx' --results-directory artifacts/installer-lifecycle/argument-probe
          if ($LASTEXITCODE -ne 0) { throw 'Production updater MSI argument tests failed.' }
          [xml]$testResult = Get-Content artifacts/installer-lifecycle/argument-probe/updater-msi.trx
          if ([int]$testResult.TestRun.ResultSummary.Counters.passed -ne 3) { throw 'MSI parser cases were skipped or missing.' }

      - name: Verify failed-upgrade rollback, custom path, upgrade and uninstall
        shell: pwsh
        run: |
          $fixtures = Get-Content -Raw './artifacts/installer-lifecycle-fixtures/${{ matrix.flavor }}/fixtures.json' | ConvertFrom-Json
          $customDirectory = Join-Path $env:ProgramFiles 'S3 Explorer lifecycle test 自定义'
          ./scripts/Test-InstallerLifecycle.ps1 -CurrentMsi $fixtures.currentMsi -PreviousMsi $fixtures.previousMsi -RollbackMsi $fixtures.rollbackMsi -AlternateMsi $fixtures.alternateMsi -InstallDirectory $customDirectory
          ./scripts/Test-InstallerLifecycle.ps1 -CurrentMsi $fixtures.currentMsi -PreviousMsi $fixtures.previousMsi -AlternateMsi $fixtures.alternateMsi -InstallDirectory (Join-Path $env:ProgramFiles 'S3 Explorer')

      - name: Reproduce old updater failure and verify default and Unicode path upgrades
        shell: pwsh
        run: |
          $fixtures = Get-Content -Raw './artifacts/installer-lifecycle-fixtures/${{ matrix.flavor }}/fixtures.json' | ConvertFrom-Json
          foreach ($directory in @('S3 Explorer', 'S3 Explorer legacy upgrade 自定义')) {
            ./scripts/Test-InstallerLifecycle.ps1 -CurrentMsi $fixtures.currentMsi -PreviousMsi $fixtures.previousMsi -LegacyUpdater $fixtures.legacyUpdater -LegacyIncompatibleMsi $fixtures.legacyIncompatibleMsi -InstallDirectory (Join-Path $env:ProgramFiles $directory)
          }

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-lifecycle-${{ matrix.flavor }}
          if-no-files-found: warn
          path: |
            artifacts/installer-lifecycle/**
            artifacts/installer-lifecycle-fixtures/**/fixtures.json
            artifacts/installer-lifecycle-fixtures/**/project/Package.wxs
            artifacts/installer-lifecycle-fixtures/**/argument-probe/Package.wxs
