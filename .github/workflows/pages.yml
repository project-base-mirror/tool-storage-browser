name: Deploy project homepage

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "scripts/Test-UpdateManifest.ps1"
      - "scripts/Verify-RemoteRelease.ps1"
      - "Directory.Build.props"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Unlike release events created with GITHUB_TOKEN, workflow_run is delivered.
  workflow_run:
    workflows: ["Publish GitHub Release"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Never run scripts from the triggering workflow's arbitrary ref.
          ref: main
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Validate update manifest and download links
        shell: pwsh
        run: ./scripts/Test-UpdateManifest.ps1

      - name: Require published release assets and matching digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Verify-RemoteRelease.ps1 -MetadataOnly

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
