name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: vX.Y.Z tag to publish
        required: true
        type: string
      create_tag:
        description: Create an annotated tag from validated main before publishing
        type: boolean
        default: false
      expected_main_sha:
        description: Exact validated main SHA (required only when creating a tag)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-tag:
    if: github.event_name == 'workflow_dispatch' && inputs.create_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out main for explicit tag preparation
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require validated main and create immutable annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == refs/heads/main ]] || { echo 'Tag preparation must run from main.'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag.'; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'An exact main SHA is required.'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]] || { echo 'Main changed before checkout.'; exit 1; }
          version="$(python -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext("./PropertyGroup/Version"))')"
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag does not match the main project version.'; exit 1; }
          [[ -f "docs/versions/$RELEASE_TAG.md" ]] || { echo 'Release notes are missing.'; exit 1; }
          pwsh -NoProfile -File ./scripts/Test-UpdateManifest.ps1
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$EXPECTED_MAIN_SHA&per_page=100")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")] | sort_by(.created_at) | last | .status == "completed" and .conclusion == "success"' <<< "$runs" > /dev/null || { echo 'Exact main commit has no successful Validate push run.'; exit 1; }
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_MAIN_SHA" ]] || { echo 'Main changed after validation.'; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'Tag already exists; use ordinary publication instead. Tags are never overwritten.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$EXPECTED_MAIN_SHA" -m "S3 Explorer $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          [[ "$(git cat-file -t "$RELEASE_TAG")" == tag ]]
          [[ "$(git rev-parse "$RELEASE_TAG^{}")" == "$EXPECTED_MAIN_SHA" ]]

  release:
    needs: prepare-tag
    # A tag pushed with GITHUB_TOKEN does not trigger another workflow run.
    # Continue here only after successful preparation, or the normal existing-tag path.
    if: always() && (needs.prepare-tag.result == 'success' || (needs.prepare-tag.result == 'skipped' && !inputs.create_tag))
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Validate tag, project version, and release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vX.Y.Z: $env:RELEASE_TAG"
          }

          [xml]$props = Get-Content -Raw ./Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match project version $version."
          }

          $notes = "docs/versions/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing version record: $notes"
          }
          "RELEASE_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate Pages update manifest
        shell: pwsh
        run: ./scripts/Test-UpdateManifest.ps1

      - name: Restore locked dependencies and enforce focused coverage
        shell: pwsh
        run: |
          dotnet restore S3Explorer.sln --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }
          dotnet restore src/S3Explorer.App/S3Explorer.App.csproj --runtime win-x64 --locked-mode --no-dependencies --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }
          dotnet restore src/S3Explorer.Cli/S3Explorer.Cli.csproj --runtime win-x64 --locked-mode --no-dependencies --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }
          ./scripts/Test-FocusedCoverage.ps1

      - name: Test and build release packages
        shell: pwsh
        env:
          S3EXPLORER_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          S3EXPLORER_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
          S3EXPLORER_REQUIRE_SIGNING: ${{ vars.CODE_SIGNING_REQUIRED }}
        run: |
          $publishParameters = @{ NoOpen = $true }
          if ($env:S3EXPLORER_REQUIRE_SIGNING -eq "true") {
            $publishParameters.RequireSigning = $true
          }
          ./scripts/Publish.ps1 @publishParameters

      - name: Validate packaged artifact structure
        shell: pwsh
        run: ./scripts/Test-Publish.ps1 -SkipPackageBuild

      - name: Run isolated Windows application smoke checks
        shell: pwsh
        run: |
          ./scripts/AppAutomation.ps1 Smoke
          ./scripts/AppAutomation.ps1 CorruptSmoke
          ./scripts/AppAutomation.ps1 SingleInstanceSmoke

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath ./artifacts/release -File |
            Where-Object { $_.Extension -in @('.zip', '.msi') } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            }
          $lines | Set-Content -LiteralPath ./artifacts/release/SHA256SUMS.txt -Encoding ascii

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S3Explorer-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            artifacts/release/S3Explorer-${{ env.RELEASE_TAG }}-win-x64.zip
            artifacts/release/S3Explorer-${{ env.RELEASE_TAG }}-win-x64-self-contained.zip
            artifacts/release/S3Explorer.Contracts-${{ env.RELEASE_TAG }}.zip
            artifacts/release/S3Explorer-${{ env.RELEASE_TAG }}-win-x64-setup.msi
            artifacts/release/S3Explorer-${{ env.RELEASE_TAG }}-win-x64-framework-dependent-setup.msi
            artifacts/release/release-metrics.json
            artifacts/release/SHA256SUMS.txt
            artifacts/coverage/**

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "./artifacts/release/S3Explorer-$($env:RELEASE_TAG)-win-x64.zip",
            "./artifacts/release/S3Explorer-$($env:RELEASE_TAG)-win-x64-self-contained.zip",
            "./artifacts/release/S3Explorer.Contracts-$($env:RELEASE_TAG).zip",
            "./artifacts/release/S3Explorer-$($env:RELEASE_TAG)-win-x64-setup.msi",
            "./artifacts/release/S3Explorer-$($env:RELEASE_TAG)-win-x64-framework-dependent-setup.msi",
            './artifacts/release/release-metrics.json',
            './artifacts/release/SHA256SUMS.txt'
          )

          $releaseTags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read existing GitHub Releases.' }
          if ($releaseTags -ccontains $env:RELEASE_TAG) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to replace release assets.' }
            # Preserve manually edited release notes when republishing an existing release.
            gh release edit $env:RELEASE_TAG --title "S3 Explorer $env:RELEASE_TAG"
          }
          else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --title "S3 Explorer $env:RELEASE_TAG" --notes-file $env:RELEASE_NOTES
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish GitHub Release.' }

      - name: Verify published release using asset digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Verify-RemoteRelease.ps1 -Tag $env:RELEASE_TAG -SkipPages
