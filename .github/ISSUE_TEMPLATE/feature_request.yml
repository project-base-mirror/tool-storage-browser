name: "✨ 功能建议"
description: "提出一个有明确使用场景的新功能或交互改进"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述要解决的问题和实际工作流，再描述希望增加的按钮、菜单或命令。这样更容易判断功能边界、兼容性和验收标准。

  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options:
        - 账户与 Provider 配置
        - Bucket 管理
        - 对象浏览与文件操作
        - 传输队列与断点续传
        - 文件夹同步
        - 命令行 CLI 与自动化
        - 安全、凭据与权限
        - 界面、图标与易用性
        - 发布、更新与文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前在哪个实际场景下不方便、容易出错或无法完成？
      placeholder: "例如：每天需要把本地目录镜像到同一个 Bucket，目前必须手工打开并分析。"
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: 建议的使用流程
      description: 从用户开始操作到完成任务，按顺序描述理想流程。
      placeholder: |
        1. 在同步任务列表选择任务
        2. 设置每天 02:00 执行
        3. 失败时保留结果并返回非零退出码
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 验收结果
      description: 哪些可观察结果出现时，可以认为这个需求已经完成？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 目前是否通过 S3 Browser、AWS CLI、脚本或其他工具完成？现有方案的问题是什么？

  - type: textarea
    id: compatibility
    attributes:
      label: Provider 与兼容性要求
      description: 如果功能涉及 S3 API，请说明需要支持的服务、权限限制、Region 或 Endpoint 特性。

  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 可提供 S3 Browser 操作截图、官方 API 文档或类似工具链接。请勿上传受保护数据或凭据。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和路线图，没有找到相同需求。
          required: true
        - label: 我描述了实际问题、建议流程和可验证的完成结果。
          required: true

